name: Portfolio tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional chart dependency
        run: python -m pip install -r requirements-viz.txt
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Full local workflow
        run: |
          python -m pipeline.generate
          python -m pipeline.run
          python -m analytics.export
          python -m ai_review.check
      - name: One-command portfolio demo
        run: python -m demo --figures
